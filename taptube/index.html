<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080711" />
    <title>TapTube — Music Video Rhythm Game</title>
    <meta
      name="description"
      content="TapTube เว็บ: เกมจังหวะบนวิดีโอ YouTube สร้างโน้ตอัตโนมัติจากเพลง เล่นได้ทันทีในเบราว์เซอร์"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="aurora__blob aurora__blob--a"></span>
      <span class="aurora__blob aurora__blob--b"></span>
      <span class="aurora__blob aurora__blob--c"></span>
    </div>

    <div id="boot" class="boot">
      <div class="boot__mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="boot__label">TapTube</p>
      <p class="boot__hint" id="boot-hint">กำลังโหลด…</p>
    </div>

    <div id="app" class="shell" hidden>
      <header class="topbar" id="topbar"></header>
      <main class="main" id="screen" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    </div>

    <div id="overlay-root" class="overlay-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <p id="sr-live" class="sr-only" aria-live="assertive"></p>

    <noscript>
      <div class="noscript">
        TapTube ต้องเปิดใช้งาน JavaScript / This app requires JavaScript.
      </div>
    </noscript>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
